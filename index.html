  <style>
    :root {
      --primary-gold: #FFD700;
      --accent-blue: #008cff;
      --bg-dark: #0a0a0a;
      --glass: rgba(255, 255, 255, 0.05);
      --glass-border: rgba(255, 255, 255, 0.1);
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', sans-serif;
    }

    body {
      min-height: 100vh;
      background: var(--bg-dark);
      display: flex;
      justify-content: center;
      align-items: center;
      color: white;
      overflow: hidden;
    }

    /* Fundo com movimento */
    .bg-visuals {
      position: absolute;
      width: 100%;
      height: 100%;
      z-index: 1;
    }

    .blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(0, 140, 255, 0.2), transparent 70%);
      filter: blur(80px);
      border-radius: 50%;
      animation: move 10s infinite alternate;
    }

    @keyframes move {
      from { transform: translate(-10%, -10%); }
      to { transform: translate(10%, 10%); }
    }

    .container {
      position: relative;
      width: 100%;
      max-width: 400px;
      padding: 40px 20px;
      text-align: center;
      z-index: 2;
    }

    /* Logo Premium */
    .logo-wrapper {
      margin-bottom: 30px;
    }

    .top-icon {
      width: 90px;
      height: 90px;
      border-radius: 24px;
      background: linear-gradient(135deg, #222, #000);
      border: 1px solid var(--glass-border);
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 15px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.5);
      transform: rotate(-5deg);
    }

    .top-icon span {
      color: var(--primary-gold);
      font-weight: 800;
      font-size: 22px;
      text-shadow: 0 0 15px rgba(255, 215, 0, 0.5);
    }

    h1 {
      font-size: 1.2rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      opacity: 0.9;
      margin-bottom: 40px;
    }

    /* Botões Estilizados */
    .link-btn {
      position: relative;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 12px;
      width: 100%;
      padding: 20px;
      margin-bottom: 18px;
      border-radius: 18px;
      text-decoration: none;
      font-weight: 600;
      font-size: 16px;
      transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
      overflow: hidden;
      border: 1px solid var(--glass-border);
    }

    .link-btn:hover {
      transform: translateY(-5px);
      box-shadow: 0 15px 30px rgba(0,0,0,0.3);
    }

    /* Botão Instagram - Estilo Dark Glass */
    .insta {
      background: var(--glass);
      color: #fff;
      backdrop-filter: blur(10px);
    }

    /* Botão BET - Destaque Principal */
    .bet {
      background: linear-gradient(90deg, #FFD700, #FFA500);
      color: #000;
      border: none;
      box-shadow: 0 10px 20px rgba(255, 215, 0, 0.2);
    }

    /* Efeito de brilho passando (Shimmer) */
    .bet::after {
      content: '';
      position: absolute;
      top: -50%;
      left: -50%;
      width: 200%;
      height: 200%;
      background: linear-gradient(45deg, transparent, rgba(255,255,255,0.4), transparent);
      transform: rotate(45deg);
      animation: shimmer 3s infinite;
    }

    @keyframes shimmer {
      0% { left: -100%; }
      100% { left: 100%; }
    }

    .icon {
      font-size: 22px;
    }

    footer {
      margin-top: 30px;
      font-size: 12px;
      opacity: 0.4;
    }
  </style>
</head>
